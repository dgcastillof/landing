<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dgcastillof</title>
  <meta name="description" content="Proyectos de dgcastillof.">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%233b1d6e'/><stop offset='1' stop-color='%230e1a3d'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/></svg>">
  <style>
    :root {
      --bg: #07060c;
      --blob1: #3b1d6e;
      --blob2: #0e2a5c;
      --blob3: #4a1236;
      --blob4: #0b3a3a;
      --fg: #f1eef8;
      --muted: rgba(241, 238, 248, .5);
      --shadow: 0 14px 34px -12px rgba(0, 0, 0, .8);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo: manchas de color oscuras y difuminadas que se mueven lento */
    .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
    .bg span {
      position: absolute;
      width: 60vmax; height: 60vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .6;
      animation: drift 30s ease-in-out infinite alternate;
    }
    .bg span:nth-child(1) { background: var(--blob1); top: -20vmax; left: -15vmax; }
    .bg span:nth-child(2) { background: var(--blob2); top: -10vmax; right: -20vmax; animation-delay: -7s; }
    .bg span:nth-child(3) { background: var(--blob3); bottom: -25vmax; left: 10vmax; animation-delay: -14s; opacity: .45; }
    .bg span:nth-child(4) { background: var(--blob4); bottom: -20vmax; right: -10vmax; animation-delay: -21s; opacity: .45; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(6vmax, 4vmax) scale(1.1); }
      100% { transform: translate(-4vmax, 6vmax) scale(.95); }
    }
    @media (prefers-reduced-motion: reduce) { .bg span { animation: none; } }

    main {
      position: relative; z-index: 1;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 16px;
      gap: 56px;
    }
    h1 {
      font: 600 1.125rem/1 ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      letter-spacing: .02em;
      color: var(--muted);
    }

    /* Grilla: las filas se arman en JS (máx. 4 por fila, repartidas parejo) */
    .grid { display: flex; flex-direction: column; align-items: center; gap: 36px; }
    .row { display: flex; justify-content: center; gap: clamp(20px, 6vw, 48px); }

    .app {
      --size: clamp(72px, 20vw, 104px);
      width: calc(var(--size) + 16px);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      color: inherit; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .icon {
      width: var(--size); height: var(--size);
      display: grid; place-items: center;
      transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
    }
    /* Ícono real (PNG/SVG): se muestra tal cual, con su propia forma */
    .icon img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .55));
    }
    /* Sin ícono propio: cuadrado con degradé y la inicial */
    .icon.fallback {
      border-radius: 26%;
      background: linear-gradient(145deg, var(--c1, #6d5bd0), var(--c2, #2a1f66));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .2);
      font-size: calc(var(--size) * .42); font-weight: 600; color: #fff;
    }
    a.app:hover .icon, a.app:focus-visible .icon { transform: translateY(-4px) scale(1.05); }
    a.app:active .icon { transform: scale(.96); }
    a.app:focus-visible { outline: none; }
    a.app:focus-visible .icon { outline: 2px solid var(--fg); outline-offset: 6px; border-radius: 26%; }
    .label { font-size: .875rem; font-weight: 500; text-align: center; }

    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 0 16px 24px; margin-top: -48px;
      font-size: .75rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main>
    <h1>dgcastillof</h1>
    <nav class="grid" id="grid" aria-label="Proyectos"></nav>
  </main>
  <footer>© <span id="year"></span></footer>

  <script>
    // ── Editá acá ─────────────────────────────────────────────
    // Solo se muestran las que tienen live: true.
    // img: ícono de la app (carpeta icons/). Si no tiene, se usa la inicial.
    // url: solo para las que tienen dominio propio (si no, va a sub.DOMAIN).
    const DOMAIN = "dgcastillof.com.ar";
    const PROJECTS = [
      { name: "Moneta",     sub: "moneta", live: true,  img: "icons/moneta.png" },
      { name: "Fluir de mí",    url: "https://fluirdemi.com.ar",       live: true, img: "icons/fluirdemi.png" },
      { name: "Utilidades UNA", url: "https://utilidades-una.com.ar", live: true, img: "icons/una.png" },
      { name: "Iris",       sub: "iris",   live: false, img: "icons/iris.svg" },
      { name: "TCG Pocket", sub: "tcg",    live: false, img: "icons/tcg.svg" },
      { name: "Argos",      sub: "argos",  live: false, img: "icons/argos.svg" },
      { name: "Vivero",     sub: "vivero", live: false, img: "icons/vivero.svg" },
    ];
    // ──────────────────────────────────────────────────────────

    // Reparte en filas de máx. 4, lo más parejas posible (5 → 3+2, 6 → 3+3, 7 → 4+3…)
    function splitRows(items, max = 4) {
      const rows = Math.ceil(items.length / max);
      const out = [];
      let i = 0;
      for (let r = 0; r < rows; r++) {
        const size = Math.ceil((items.length - i) / (rows - r));
        out.push(items.slice(i, i + size));
        i += size;
      }
      return out;
    }

    function appEl(p) {
      const el = document.createElement("a");
      el.className = "app";
      el.href = p.url || `https://${p.sub}.${DOMAIN}`;
      el.innerHTML = p.img
        ? `<span class="icon"><img src="${p.img}" alt=""></span>`
        : `<span class="icon fallback" style="${p.c1 ? `--c1:${p.c1};--c2:${p.c2}` : ""}">${p.name[0]}</span>`;
      el.insertAdjacentHTML("beforeend", `<span class="label">${p.name}</span>`);
      return el;
    }

    const grid = document.getElementById("grid");
    for (const row of splitRows(PROJECTS.filter(p => p.live))) {
      const r = document.createElement("div");
      r.className = "row";
      row.forEach(p => r.appendChild(appEl(p)));
      grid.appendChild(r);
    }
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
